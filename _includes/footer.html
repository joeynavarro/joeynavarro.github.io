<footer class="footer">
  <div class="footer__inner"><div class="container"><div class="row">
    {% include footer-widgets/widget-info.html %}
    {% include footer-widgets/widget-subscribe.html %}
    {% include footer-widgets/widget-tags.html %}
  </div></div></div>
  <div class="container"><div class="row"><div class="col col-12"><div class="footer__info">
    <div class="copyright footer-info-localized">{{ site.time | date: '%Y' }} &copy; <a href="{{ home_url | relative_url }}">{{ site.title }}</a>. {{ t.academic_site }}. <a href="https://navarrotech.org" target="_blank" rel="noopener noreferrer">Navarro Technologies ↗</a></div>
    <button class="toggle-theme" type="button" aria-label="{{ t.theme }}"><span class="toggle-moon"><i class="ion ion-ios-moon" aria-hidden="true"></i></span><span class="toggle-sun"><i class="ion ion-ios-sunny" aria-hidden="true"></i></span><span class="toggle-thumb"></span></button>
  </div></div></div></div>
</footer>
