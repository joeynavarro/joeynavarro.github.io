{% if site.mailchimp %}
<div class="col col-4 col-d-6 col-t-12">
  <div class="widget widget-subscribe">
    <div class="widget__head">
      <h3 class="widget__title">{{ t.newsletter_title }}</h3>
    </div>
    <div class="subscribe__inner">
      {% if site.mailchimp__text %}
      <div class="subscribe__group">
        <div class="subscribe__description">{{ t.newsletter_description }}</div>
      </div>
      {% endif %}
      <form class="subscribe-form validate"
        action="{% if site.mailchimp__identifier %}//{{site.mailchimp__identifier}}{% else %}#{% endif %}" method="POST" id="membedded-subscribe-form" name="membedded-subscribe-form" target="_blank" novalidate>
        <label class="screen-reader-text" for="mce-EMAIL">{{ t.email_address }}</label>
        <input class="subscribe-email required email" id="mce-EMAIL" type="text" name="EMAIL"
          placeholder="{{ t.email_address }}">
        <button class="button subscribe-button" id="membedded-subscribe" type="submit" name="subscribe">{{ t.join }}</button>
      </form>
    </div>
  </div>
</div>
{% endif %}
